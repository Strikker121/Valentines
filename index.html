<!DOCTYPE html>
<html>
<head>
  <title>For You ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<audio id="popSound" src="pop.mp3" preload="auto"></audio>

<body>
  <div class="hearts"></div>



  <div class="section">
    <h1>Hey Love ❤️</h1>
    <p>I made something special just for you…</p>
    <button onclick="next()">Tap to continue</button>
  </div>

  <div class="section" id="page2" style="display:none;">
    <h2>The Day We Met 💫</h2>
    <p>I didn’t know you’d become my favorite person.</p>
    <button onclick="next2()">Next</button>
  </div>

  <div class="section" id="page3" style="display:none;">
    <h2>Why I Love You 💖</h2>
    <p>Your smile. Your heart. Everything about you.</p>
    <button onclick="surprise()">Open Surprise 🎁</button>
  </div>

  <div class="section" id="final" style="display:none;">
    <h1>Surprise! 🎉</h1>
    <p>Your gift is… A date with me on Valentine’s Day ❤️</p>
  </div>

<script>
function next() {
  document.querySelector(".section").style.display = "none";
  document.getElementById("page2").style.display = "flex";
}

function next2() {
  document.getElementById("page2").style.display = "none";
  document.getElementById("page3").style.display = "flex";
}

function surprise() {
  document.getElementById("page3").style.display = "none";
  document.getElementById("final").style.display = "flex";
}

/* Heart pop system */
const heartsContainer = document.querySelector('.hearts');
const popSound = document.getElementById('popSound');

function createHeart() {
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.animationDuration = (6 + Math.random() * 5) + 's';

  heartsContainer.appendChild(heart);

  setTimeout(() => {
    heart.classList.add('pop');
    popSound.currentTime = 0;
    popSound.play().catch(()=>{});
    setTimeout(() => heart.remove(), 300);
  }, 6000);
}

setInterval(createHeart, 800);
</script>

</body>
</html>
