<!DOCTYPE html>
<html>
<head>
  <title>For You ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="memories.css">

</head>
<body>

<audio id="popSound" src="pop.mp3" preload="auto"></audio>

<div class="hearts"></div>
<div class="sparkles"></div>

<!-- Page 1 -->
<div class="section" id="page1">
  <h1>Hey Billu ❤️</h1>
  <p>Meine Apke Liye kuch Bnane Ki Try Hai…</p>
  <button id="startBtn">Tap to continue</button>
</div>

<!-- Page 2 -->
<div class="section" id="page2" style="display:none;">
  <h2>Jb Hum First Time Mile the 💫</h2>
  <p>Meine Nhi Socha tha ki Ap Mere Favourite Person Bn Jaoge.</p>
  <button id="next2Btn">Next</button>
</div>

<!-- Page 3 -->
<div class="section" id="page3" style="display:none;">
  <h2>Mujhe Aap Kyun Psnd ho? 💖</h2>
  <p>Apki Smile. Apki Batein, Hsna, Rona, Drana. Aapka Sbb Kuch.</p>
  <button id="memoriesBtn">See Our Memories 📸</button>
</div>

<!-- Memories Section -->
<div class="section" id="memoriesSection" style="display:none;"></div>

<!-- Final Valentine Page -->
<div id="final" class="section" style="display:none;">
  <h1>Will You Be My Valentine? 💖</h1>
  <div class="valentine-buttons">
    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">NO </button>
  </div>
  <p id="responseText"></p>
</div>

<!-- 🎵 Floating Music Control -->
<div id="musicControl">
  <img id="musicBtn" src="music-icon.png" alt="Music" />

  <div id="musicDropdown">
    <button onclick="playMainSong()">Romantic Theme ❤️</button>
    <button onclick="playRandomSong()">Surprise Me ✨</button>
    <button onclick="stopMusic()">Do Not Play 🔕</button>
  </div>
</div>

<audio id="bgMusic"></audio>




<script src="memories.js"></script>

<script src="script.js"></script>
</body>
</html>
