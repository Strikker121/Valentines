<!DOCTYPE html>
<html>
<head>
  <title>For You ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="popSound" src="pop.mp3" preload="auto"></audio>
<audio id="bgMusic" src="music.mp3" loop></audio>

<div class="hearts"></div>
<div class="sparkles"></div>

<div class="section" id="page1">
  <h1>Hey Love ❤️</h1>
  <p>I made something special just for you…</p>
  <button onclick="next()">Tap to continue</button>
</div>

<div class="section" id="page2" style="display:none;">
  <h2>The Day We Met 💫</h2>
  <p>I didn’t know you’d become my favorite person.</p>
  <button onclick="next2()">Next</button>
</div>

<div class="section" id="page3" style="display:none;">
  <h2>Why I Love You 💖</h2>
  <p>Your smile. Your heart. Everything about you.</p>
  <button onclick="startSlideshow()">See Our Memories 📸</button>
</div>

<div class="section" id="slideshow" style="display:none;">
  <img id="memoryPhoto" src="photos/pic1.jpg">
  <button onclick="surprise()">Final Surprise 🎁</button>
</div>

<div class="section" id="final" style="display:none;">
  <h1>Surprise! 🎉</h1>
  <p>Your gift is… A date with me on Valentine’s Day ❤️</p>
</div>

<script src="script.js"></script>
</body>
</html>
